<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CV</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
        }
        .cv-frame {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            background: #fff;
        }
        #cv-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .cv-fab {
            position: fixed;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.3rem;
            border-radius: 999px;
            border: none;
            background: var(--primary-color);
            color: #0b0f14;
            font-weight: bold;
            font-size: 0.95rem;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .cv-fab:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
        }
        .cv-fab-download {
            bottom: 1.2rem;
            right: 1.2rem;
        }
        .cv-fab-back {
            top: 1rem;
            left: 1rem;
            background: var(--surface-color);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }
        .cv-mobile-bar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1rem;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--primary-color);
        }
        .cv-mobile-bar a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 0.35rem 0.5rem;
        }
        .cv-mobile-bar a:hover {
            text-decoration: underline;
        }
        .cv-mobile-bar .cv-mobile-download {
            color: #0b0f14;
            background: var(--primary-color);
            border-radius: 999px;
            padding: 0.4rem 1rem;
        }
        .cv-mobile-bar .cv-mobile-download:hover {
            text-decoration: none;
            filter: brightness(1.1);
        }
        @media (max-width: 600px) {
            .cv-fab {
                display: none;
            }
            .cv-mobile-bar {
                display: flex;
            }
            #cv-iframe {
                top: 54px;
                height: calc(100% - 54px);
            }
        }
    </style>
</head>
<body>
    <div class="cv-frame">
        <iframe id="cv-iframe" src="cv.pdf"></iframe>
    </div>
    <div class="cv-mobile-bar">
        <a href="index.html">&larr; Back</a>
        <a class="cv-mobile-download" href="cv.pdf" download>Download</a>
    </div>
    <a class="cv-fab cv-fab-back" href="index.html" aria-label="Back to Portfolio">&larr;</a>
    <a class="cv-fab cv-fab-download" href="cv.pdf" download>Download PDF</a>
</body>
</html>
